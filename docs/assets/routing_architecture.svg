<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Symbiosis-Edge supervision-routing method</title>
  <desc id="desc">A stream instance is scored by the edge model. Entropy and probability margin determine uncertainty, adaptive quantiles define two thresholds, and the instance is assigned to edge, oracle, or human supervision.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#0072b2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#d55e00"/>
    </marker>
    <style>
      .label { font: 600 22px Arial, Helvetica, sans-serif; fill: #202124; }
      .small { font: 17px Arial, Helvetica, sans-serif; fill: #5f6368; }
      .math { font: italic 21px "Cambria Math", "Times New Roman", serif; fill: #202124; }
      .condition { font: italic 18px "Cambria Math", "Times New Roman", serif; }
      .step { font: 600 15px Arial, Helvetica, sans-serif; fill: #5f6368; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="558" fill="#ffffff" stroke="#c8cdd2" stroke-width="2"/>

  <!-- Stream -->
  <g transform="translate(48 175)">
    <text x="0" y="-31" class="step">STREAM</text>
    <rect width="218" height="190" rx="8" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <line x1="40" y1="48" x2="178" y2="48" stroke="#9aa0a6" stroke-width="2"/>
    <line x1="40" y1="95" x2="178" y2="95" stroke="#9aa0a6" stroke-width="2"/>
    <line x1="40" y1="142" x2="178" y2="142" stroke="#0072b2" stroke-width="3"/>
    <circle cx="40" cy="48" r="7" fill="#9aa0a6"/>
    <circle cx="40" cy="95" r="7" fill="#9aa0a6"/>
    <circle cx="40" cy="142" r="8" fill="#0072b2"/>
    <text x="61" y="54" class="math">x<tspan baseline-shift="sub" font-size="15">t−2</tspan></text>
    <text x="61" y="101" class="math">x<tspan baseline-shift="sub" font-size="15">t−1</tspan></text>
    <text x="61" y="148" class="math">x<tspan baseline-shift="sub" font-size="15">t</tspan></text>
  </g>

  <!-- Edge prediction -->
  <g transform="translate(344 175)">
    <text x="0" y="-31" class="step">EDGE INFERENCE</text>
    <rect width="260" height="190" rx="8" fill="#f4f9fc" stroke="#0072b2" stroke-width="2.5"/>
    <text x="130" y="50" text-anchor="middle" class="label">Predictive distribution</text>
    <text x="130" y="82" text-anchor="middle" class="math">p<tspan baseline-shift="sub" font-size="15">t</tspan> = f<tspan baseline-shift="sub" font-size="15">θ</tspan>(x<tspan baseline-shift="sub" font-size="15">t</tspan>)</text>
    <rect x="42" y="128" width="38" height="28" fill="#c6e3f2"/>
    <rect x="83" y="113" width="38" height="43" fill="#86c2df"/>
    <rect x="124" y="100" width="38" height="56" fill="#0072b2"/>
    <rect x="165" y="135" width="38" height="21" fill="#c6e3f2"/>
  </g>

  <!-- Uncertainty -->
  <g transform="translate(682 175)">
    <text x="0" y="-31" class="step">UNCERTAINTY</text>
    <rect width="278" height="190" rx="8" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="139" y="50" text-anchor="middle" class="label">Score</text>
    <text x="139" y="93" text-anchor="middle" class="math">u<tspan baseline-shift="sub" font-size="15">t</tspan> = H(p<tspan baseline-shift="sub" font-size="15">t</tspan>) + α[1 − m(p<tspan baseline-shift="sub" font-size="15">t</tspan>)]</text>
    <line x1="49" y1="139" x2="229" y2="139" stroke="#9aa0a6" stroke-width="2"/>
    <circle cx="195" cy="139" r="9" fill="#202124"/>
    <text x="49" y="167" class="small">low</text>
    <text x="229" y="167" text-anchor="end" class="small">high</text>
  </g>

  <!-- Threshold estimator -->
  <g transform="translate(1038 175)">
    <text x="0" y="-31" class="step">ADAPTIVE THRESHOLDS</text>
    <rect width="264" height="190" rx="8" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
    <text x="132" y="43" text-anchor="middle" class="small">Recent scores <tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="13">W</tspan></text>
    <line x1="42" y1="84" x2="222" y2="84" stroke="#9aa0a6" stroke-width="2"/>
    <line x1="42" y1="119" x2="222" y2="119" stroke="#cc79a7" stroke-width="4"/>
    <line x1="42" y1="154" x2="222" y2="154" stroke="#d55e00" stroke-width="4"/>
    <text x="52" y="77" class="small">edge region</text>
    <text x="52" y="113" class="condition" fill="#a85282">τ<tspan baseline-shift="sub" font-size="13">oracle</tspan></text>
    <text x="52" y="148" class="condition" fill="#b44d00">τ<tspan baseline-shift="sub" font-size="13">human</tspan></text>
  </g>

  <!-- Main arrows -->
  <path d="M266 270H330" fill="none" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M604 270H668" fill="none" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M960 270H1024" fill="none" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Destinations -->
  <g transform="translate(1370 57)">
    <rect width="188" height="112" rx="8" fill="#f4f9fc" stroke="#0072b2" stroke-width="2.5"/>
    <text x="94" y="43" text-anchor="middle" class="label" fill="#0072b2">Edge</text>
    <text x="94" y="76" text-anchor="middle" class="condition" fill="#0072b2">u<tspan baseline-shift="sub" font-size="13">t</tspan> ≤ τ<tspan baseline-shift="sub" font-size="13">oracle</tspan></text>
  </g>

  <g transform="translate(1370 224)">
    <rect width="188" height="112" rx="8" fill="#fcf7fa" stroke="#cc79a7" stroke-width="2.5"/>
    <text x="94" y="43" text-anchor="middle" class="label" fill="#a85282">Oracle</text>
    <text x="94" y="76" text-anchor="middle" class="condition" fill="#a85282">τ<tspan baseline-shift="sub" font-size="13">oracle</tspan> &lt; u<tspan baseline-shift="sub" font-size="13">t</tspan> ≤ τ<tspan baseline-shift="sub" font-size="13">human</tspan></text>
  </g>

  <g transform="translate(1370 391)">
    <rect width="188" height="112" rx="8" fill="#fdf7f3" stroke="#d55e00" stroke-width="2.5"/>
    <text x="94" y="43" text-anchor="middle" class="label" fill="#b44d00">Human</text>
    <text x="94" y="76" text-anchor="middle" class="condition" fill="#b44d00">u<tspan baseline-shift="sub" font-size="13">t</tspan> &gt; τ<tspan baseline-shift="sub" font-size="13">human</tspan></text>
  </g>

  <!-- Branches -->
  <path d="M1334 270V113H1356" fill="none" stroke="#0072b2" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M1302 270H1356" fill="none" stroke="#cc79a7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1334 270V447H1356" fill="none" stroke="#d55e00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- Window feedback -->
  <path d="M821 365V466H1170V379" fill="none" stroke="#7b8085" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="881" y="443" width="236" height="44" fill="#ffffff"/>
  <text x="999" y="471" text-anchor="middle" class="small">sliding window of recent scores</text>

  <!-- Budget note -->
  <text x="1170" y="524" text-anchor="middle" class="small">
    <tspan font-style="italic">B</tspan><tspan baseline-shift="sub" font-size="13">O</tspan>: oracle budget ·
    <tspan font-style="italic">B</tspan><tspan baseline-shift="sub" font-size="13">H</tspan>: human budget
  </text>
</svg>
